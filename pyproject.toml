[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pyfog"
version = "1.4.0"
description = "Read-only command line view on a FOG imaging server, straight from its database"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.6"
dependencies = ["pymysql>=0.9"]

[project.scripts]
pyfog = "pyfog.cli:main"

[tool.setuptools]
packages = ["pyfog"]
